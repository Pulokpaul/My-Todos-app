<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>Todo application</title>
</head>

<body>
  <h1 class="text-3xl font-bold text-center">
    My todo application
  </h1>

  <div class="flex gap-5 item-center justify-center mt-5">
    <input id="taskInput" type="text" placeholder="Enter your task"
      class="border border-gray rounded-lg outline-none px-2 py-1">
    <button id="addBtn" class="bg-black text-white px-3 py-1 rounded-md">Add</button>
  </div>
</body>
<!-- todo list -->
<ul id="totoList"></ul>
<!-- script  start-->
<script>
  const taskInput = document.getElementById("taskInput")

  const addBtn = document.getElementById("addBtn")
  const todoList = document.getElementById("totoList")
  let todos = []


  function renderTodos() {
    todoList.innerHTML = ""
    todos.forEach((todo) => {
      todoList.innerHTML += `
    <li>
 <div> 
<input type="checkbox"
${todo.complated ? "checked" : ""
        }/>

  <span>
  ${todo.titel}
  </span >
 </div >
    </li >`
    })
  }
  addBtn.addEventListener("click", () => {
    const task = taskInput.value
    todos.push({
      titel: task,
      complated: false
    })
    localStorage.setItem("todos", JSON.stringify(todos))
    renderTodos()
  })
  const savedTodos = localStorage.getItem("todos")

  // console.log("save todos from is" ,savedTodos )

  if (savedTodos) { todos = JSON.parse(savedTodos) }
  console.log(todos)



  function renderTodos() {
    todoList.innerHTML = ""
    todos.forEach((todo) => {
      todoList.innerHTML += `
    <li>
 <div> 
<input type="checkbox"
${todo.complated ? "checked" : ""
        }/>

  <span>
  ${todo.titel}
  </span >
 </div >
    </li >`
    })
  }
  renderTodos()
</script>
<!-- script End-->


</html>
